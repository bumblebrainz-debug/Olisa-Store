<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Olisa store admin</title>
<style>
  :root {
    --bg: #f3f5f2; --card: #ffffff; --ink: #17211b; --muted: #64706a; --line: #dde3de;
    --accent: #1f5c46; --accent-ink: #ffffff; --warn: #a63a2b;
    --new: #8a6d1d; --confirmed: #1f5c46; --packed: #2d5b8a; --shipped: #6b3f8f; --delivered: #17211b; --cancelled: #a63a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121714; --card: #1b221e; --ink: #e8eee9; --muted: #98a59d; --line: #2e3832; --accent: #5fbf98; --accent-ink: #0d1411; --warn: #e07a68;
      --new: #d9b44a; --confirmed: #5fbf98; --packed: #7fb0e3; --shipped: #be94e0; --delivered: #e8eee9; --cancelled: #e07a68; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 12px; min-height: 40px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: wait; }
  input { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 44px; }
  .login { max-width: 380px; margin: 48px auto; display: grid; gap: 12px; }
  .login p { color: var(--muted); margin: 0; }
  .err { color: var(--warn); min-height: 1.4em; margin: 0; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .filters button { white-space: nowrap; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .order { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; border-left: 6px solid var(--c, var(--line)); }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .code { font-weight: 700; }
  .pkg { color: var(--muted); font-size: 14px; }
  .badge { font-weight: 600; font-size: 14px; color: var(--c); }
  .who { margin: 8px 0 0; }
  .who a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0; }
  .items { margin: 8px 0; padding-left: 18px; }
  .total { font-weight: 700; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .actions button[aria-current="true"] { background: var(--c); color: var(--bg); border-color: var(--c); font-weight: 600; }
  .actions .cancel { color: var(--warn); border-color: var(--warn); margin-left: auto; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: 90%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<section id="loginView" class="login">
  <h1>Olisa store admin</h1>
  <p>Enter your admin key to see and update orders.</p>
  <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
  <button id="loginBtn" class="primary">Open orders</button>
  <p id="loginErr" class="err" role="alert"></p>
</section>

<section id="appView" hidden>
  <header>
    <h1>Orders</h1>
    <div><button id="refreshBtn">Refresh</button> <button id="logoutBtn">Log out</button></div>
  </header>
  <main>
    <div id="filters" class="filters" role="group" aria-label="Filter by status"></div>
    <div id="list"></div>
  </main>
</section>

<div id="toast" class="toast" hidden role="status"></div>

<script>
const STATUS = [
  { id: 'confirmed', label: 'Confirm', name: 'Confirmed' },
  { id: 'packed', label: 'Packed', name: 'Packed' },
  { id: 'shipped', label: 'On the way', name: 'On the way' },
  { id: 'delivered', label: 'Delivered', name: 'Delivered' }
];
const NAMES = { new: 'New', confirmed: 'Confirmed', packed: 'Packed', shipped: 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const naira = n => '\u20A6' + Number(n).toLocaleString('en-NG');

let key = '';
try { key = sessionStorage.getItem('olisa-admin-key') || ''; } catch (e) {}
let orders = [];
let filter = 'all';

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-key': key }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
  return data;
}

async function load() {
  try {
    orders = await api('/orders');
    $('loginView').hidden = true; $('appView').hidden = false;
    render();
  } catch (e) {
    if (e.status === 401) {
      logout();
      $('loginErr').textContent = 'That key is not correct. Check it and try again.';
    } else {
      toast('Could not load orders. Check your connection and refresh.');
    }
  }
}

function logout() {
  key = '';
  try { sessionStorage.removeItem('olisa-admin-key'); } catch (e) {}
  $('appView').hidden = true; $('loginView').hidden = false;
}

function waLink(phone) {
  let d = String(phone).replace(/\D/g, '');
  if (d.startsWith('0')) d = '234' + d.slice(1);
  return 'https://wa.me/' + d;
}

function renderFilters() {
  const counts = { all: orders.length };
  orders.forEach(o => counts[o.status] = (counts[o.status] || 0) + 1);
  const opts = ['all', 'new', 'confirmed', 'packed', 'shipped', 'delivered', 'cancelled'];
  $('filters').innerHTML = opts.map(s =>
    `<button data-f="${s}" aria-pressed="${s === filter}">${s === 'all' ? 'All' : NAMES[s]} (${counts[s] || 0})</button>`).join('');
}

function render() {
  renderFilters();
  const list = orders.slice().reverse().filter(o => filter === 'all' || o.status === filter);
  if (!list.length) {
    $('list').innerHTML = '<p class="empty">No orders here yet. New orders appear when customers check out.</p>';
    return;
  }
  $('list').innerHTML = list.map(o => {
    const c = `var(--${o.status})`;
    const when = new Date(o.createdAt).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' });
    return `<article class="order" style="--c:${c}">
      <div class="top"><span class="code">${esc(o.id)}</span><span class="badge">${NAMES[o.status] || esc(o.status)}</span></div>
      <div class="pkg">${esc(o.packageCode)} &middot; ${esc(when)}</div>
      <p class="who"><strong>${esc(o.customer.name)}</strong><br>
        <a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a> &middot; <a href="${waLink(o.customer.phone)}" target="_blank" rel="noopener">WhatsApp</a></p>
      <div class="meta">${esc(o.customer.address)}</div>
      ${o.customer.note ? `<div class="meta">Note: ${esc(o.customer.note)}</div>` : ''}
      <ul class="items">${o.items.map(i => `<li>${i.qty} &times; ${esc(i.name)} ${esc(i.storage)}</li>`).join('')}</ul>
      <div class="total">${naira(o.total)} to collect</div>
      <div class="actions">
        ${STATUS.map(s => `<button data-code="${esc(o.id)}" data-status="${s.id}" ${o.status === s.id ? 'aria-current="true" disabled' : ''} style="--c:var(--${s.id})">${s.label}</button>`).join('')}
        ${o.status === 'cancelled' ? '' : `<button class="cancel" data-code="${esc(o.id)}" data-status="cancelled">Cancel</button>`}
      </div>
    </article>`;
  }).join('');
}

async function setStatus(code, status, btn) {
  if (status === 'cancelled' && !confirm('Cancel order ' + code + '? The phones go back into stock.')) return;
  btn.disabled = true;
  try {
    const updated = await api('/orders/' + encodeURIComponent(code), { method: 'PATCH', body: JSON.stringify({ status }) });
    const i = orders.findIndex(o => o.id === updated.id);
    if (i > -1) orders[i] = updated;
    render();
    toast(code + ' is now ' + NAMES[status]);
  } catch (e) {
    btn.disabled = false;
    toast(e.status === 401 ? 'Key not accepted. Log in again.' : 'Could not update ' + code + '. Try again.');
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; render(); }
  if (b.dataset.status) setStatus(b.dataset.code, b.dataset.status, b);
});
$('loginBtn').addEventListener('click', () => {
  key = $('key').value.trim();
  if (!key) { $('loginErr').textContent = 'Enter your admin key.'; return; }
  $('loginErr').textContent = '';
  try { sessionStorage.setItem('olisa-admin-key', key); } catch (e) {}
  load();
});
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('refreshBtn').addEventListener('click', load);
$('logoutBtn').addEventListener('click', logout);

if (key) load();
</script>
</body>
</html>
